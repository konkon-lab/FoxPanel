name: 报告 Bug
description: 程序或组件出了问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢你的反馈！提交前请先搜索一下，看看有没有人报告过同样的问题。
  - type: textarea
    id: what
    attributes:
      label: 问题描述
      description: 出了什么问题，你期望的结果是什么
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 出现…
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FoxPanel 版本
      description: 主窗口「设置」页里能看到
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 运行方式
      options:
        - 安装包
        - 源码(npm start)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 系统、头显和 SteamVR 版本
      placeholder: Windows 11 24H2，Quest 3，SteamVR 2.x
  - type: textarea
    id: components
    attributes:
      label: 装了哪些第三方组件
      description: 只装了预装组件就留空
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 主窗口「日志」页里出问题前后的几行；不要贴 API Key 等密钥
      render: text
  - type: textarea
    id: extra
    attributes:
      label: 截图或其他补充
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我搜索过已有的 Issue，没有重复
          required: true
        - label: 我用的是最新版本，问题还在
